# nginx site configuration for the galaga game
# this file replaces the image's default server block

server {
    listen 80;
    server_name _;

    # web root - matches where the Dockerfile copies the game files.
    root /usr/share/nginx/html;
    index index.html;

    # serve the game. if a path isn't found, fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Lightweight health-check endpoint used by Kubernetes probes.
    # returns HTTP 200 with the text "ok" and does no disk access
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # cache static art aggressively; it rarely changes
    location ~* \.(png|jpg|jpeg|gif|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}